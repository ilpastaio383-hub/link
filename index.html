<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>il pastaio</title>
<meta name="description" content="il pastaio — Cucina Italiana. Emilio Mitre 383, Caballito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a2314;
    --paper:#ece4d3;
    --card:#f6f0e2;
    --wine:#6b2a2a;
    --gold:#a8823f;
    --line:#d8c9a8;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family:'Space Mono', monospace;
    -webkit-font-smoothing:antialiased;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding: 40px 18px 70px;
  }
  .card{
    width:100%;
    max-width: 400px;
    background: var(--card);
    border: 1.5px solid rgba(120,90,40,0.3);
    box-shadow: 0 24px 48px -20px rgba(58,35,20,0.35);
  }
  .card-inner{
    padding: 0 26px 30px;
  }
  .logo{
    width:100%;
    display:block;
    border-bottom: 1.5px solid rgba(120,90,40,0.3);
  }
  header{
    text-align:center;
    padding: 20px 0 6px;
  }
  .tagline{
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .eyebrow{
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8a7554;
    padding: 22px 0 10px;
    text-align:center;
  }
  nav{ display:flex; flex-direction:column; }

  .link-row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 15px 2px;
    text-decoration:none;
    color: var(--ink);
    border-bottom: 1.5px dashed var(--line);
    font-family: 'Cinzel', serif;
  }
  nav > *:last-child{ border-bottom:none; }

  .link-icon{
    width: 34px; height:34px;
    flex: 0 0 auto;
    border-radius:50%;
    background: var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    border: 1.5px solid var(--line);
  }
  .link-text{ flex:1; display:flex; flex-direction:column; }
  .link-title{ font-weight:600; font-size:15px; letter-spacing:0.02em; }
  .link-sub{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:#8a7554;
    margin-top:2px;
    letter-spacing:0.02em;
  }
  .link-arrow{ color: var(--wine); font-size:16px; font-family:'Space Mono', monospace; }

  .link-row.disabled{
    opacity: 0.6;
    cursor: default;
  }
  .badge-soon{
    font-family:'Space Mono', monospace;
    font-size: 8.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--wine);
    border: 1px solid var(--wine);
    border-radius: 20px;
    padding: 3px 8px;
    flex: 0 0 auto;
  }

  footer{ text-align:center; margin-top:26px; }
  footer p{
    font-size:9px;
    letter-spacing:0.08em;
    color:#a89871;
    margin:2px 0;
  }
</style>
</head>
<body>

  <div class="card">
    <img class="logo" src="logo-v2.jpg" alt="il pastaio — Cucina Italiana">

    <div class="card-inner">
      <header>
        <div class="tagline">Emilio Mitre 383 · Caballito</div>
      </header>

      <div class="eyebrow">Visitanos</div>
      <nav>
        <div class="link-row disabled">
          <span class="link-icon">🍝</span>
          <span class="link-text">
            <span class="link-title">Menú</span>
            <span class="link-sub">Muy pronto disponible</span>
          </span>
          <span class="badge-soon">En preparación</span>
        </div>

        <a class="link-row" href="https://wa.me/5491122806075" target="_blank" rel="noopener">
          <span class="link-icon">↳</span>
          <span class="link-text">
            <span class="link-title">WhatsApp</span>
            <span class="link-sub">11 2280-6075</span>
          </span>
          <span class="link-arrow">→</span>
        </a>

        <a class="link-row" href="https://instagram.com/ilpastaiocucinaitaliana" target="_blank" rel="noopener">
          <span class="link-icon">✷</span>
          <span class="link-text">
            <span class="link-title">Instagram</span>
            <span class="link-sub">@ilpastaiocucinaitaliana</span>
          </span>
          <span class="link-arrow">→</span>
        </a>

        <a class="link-row" href="https://www.google.com/maps/search/?api=1&query=Emilio+Mitre+383+Caballito+Buenos+Aires" target="_blank" rel="noopener">
          <span class="link-icon">⚲</span>
          <span class="link-text">
            <span class="link-title">Cómo llegar</span>
            <span class="link-sub">Ver en Google Maps</span>
          </span>
          <span class="link-arrow">→</span>
        </a>
      </nav>

      <footer>
        <p>Cucina Italiana</p>
        <p>Buenos Aires, Argentina</p>
      </footer>
    </div>
  </div>

</body>
</html>
