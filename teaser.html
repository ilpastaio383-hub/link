<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>???</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a2314;
    --paper:#ece4d3;
    --card:#f6f0e2;
    --wine:#6b2a2a;
    --gold:#a8823f;
    --line:#d8c9a8;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    color: var(--ink);
    font-family:'Space Mono', monospace;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding: 24px;
  }
  .card{
    width:100%;
    max-width: 380px;
    background: var(--card);
    border: 1.5px solid rgba(120,90,40,0.3);
    box-shadow: 0 24px 48px -20px rgba(58,35,20,0.35);
    padding: 40px 26px 34px;
    text-align:center;
    position:relative;
    overflow:hidden;
    min-height: 440px;
  }

  .stage{
    perspective: 700px;
    height: 190px;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }

  .dropper{
    position:relative;
    animation: fall 1s cubic-bezier(.5,0,.75,.4) forwards;
  }
  @keyframes fall{
    0%   { transform: translateY(-240px) rotate(-12deg) scale(0.8); opacity: 0.4; }
    72%  { transform: translateY(0) rotate(2deg) scale(1); opacity: 1; }
    80%  { transform: translateY(0) scaleX(1.28) scaleY(0.68) rotate(0deg); }
    88%  { transform: translateY(-14px) scaleX(0.92) scaleY(1.1) rotate(-3deg); }
    94%  { transform: translateY(0) scaleX(1.08) scaleY(0.94) rotate(1deg); }
    100% { transform: translateY(0) scaleX(1) scaleY(1) rotate(0deg); }
  }

  .raviolo{
    width: 92px;
    height: 92px;
    position: relative;
    margin: 0 auto;
    border-radius: 16px;
    background: radial-gradient(circle at 35% 30%, #f7e6ad 0%, #eecf7e 55%, #e0b95c 100%);
    box-shadow:
      inset 0 0 0 3px #f9edc4,
      inset -6px -8px 14px rgba(170,120,30,0.3),
      0 5px 8px rgba(58,35,20,0.25);
  }
  .raviolo::before{
    /* borde pellizcado tipo tenedor */
    content:"";
    position:absolute;
    inset: -2px;
    border-radius: 18px;
    border: 3px dashed rgba(199,154,58,0.55);
  }
  .raviolo .face{
    position:absolute;
    top: 38px; left:50%;
    transform: translateX(-50%);
    width: 60px;
    text-align:center;
  }
  .raviolo .eyes{
    display:flex;
    justify-content:center;
    gap: 16px;
  }
  .raviolo .eyes span{
    width: 7px; height: 7px;
    background: #4a2412;
    border-radius: 50%;
    display:block;
  }
  .raviolo .mouth{
    width: 16px; height: 8px;
    border-radius: 0 0 16px 16px;
    background: #a8452f;
    margin: 5px auto 0;
  }
  .raviolo .cheeks{
    position:absolute;
    top: 2px; left: 0; right: 0;
  }
  .raviolo .cheeks::before,
  .raviolo .cheeks::after{
    content:"";
    position:absolute;
    top:0;
    width: 10px; height: 6px;
    border-radius: 50%;
    background: rgba(212,90,60,0.45);
  }
  .raviolo .cheeks::before{ left: -2px; }
  .raviolo .cheeks::after{ right: -2px; }

  .box.open .raviolo{
    animation: raviolo-open 0.45s ease forwards;
  }
  @keyframes raviolo-open{
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    60%  { transform: scale(1.22) rotate(6deg); opacity: 1; }
    100% { transform: scale(1.4) rotate(10deg); opacity: 0; }
  }

  .shadow{
    position:absolute;
    bottom: 2px;
    width: 96px;
    height: 14px;
    background: radial-gradient(ellipse, rgba(58,35,20,0.35) 0%, transparent 70%);
    border-radius: 50%;
    animation: shadowgrow 1s ease forwards;
    transform: scale(0.2);
    opacity: 0;
  }
  @keyframes shadowgrow{
    0%   { transform: scale(0.2); opacity: 0; }
    75%  { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(0.9); opacity: 0.6; }
  }

  .burst{
    position:absolute;
    top: -14px; left:50%;
    transform: translateX(-50%) scale(0);
    z-index: 4;
    opacity: 0;
  }
  .burst.show{
    animation: pop 0.5s cubic-bezier(.3,1.7,.4,1) forwards;
  }
  @keyframes pop{
    0%   { transform: translateX(-50%) scale(0) rotate(-8deg); opacity: 0; }
    60%  { transform: translateX(-50%) scale(1.18) rotate(4deg); opacity: 1; }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
  }
  .burst-star{
    width: 74px; height: 74px;
    background: var(--gold);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 4px 8px rgba(58,35,20,0.35));
  }
  .discount{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-52%);
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size: 19px;
    color: var(--ink);
  }

  .confetti{
    position:absolute;
    top: 20px; left:50%;
    width: 0; height: 0;
    z-index: 5;
  }
  .confetti span{
    position:absolute;
    width: 7px; height: 10px;
    opacity: 0;
    border-radius: 1px;
  }
  .confetti.burst span{
    animation: confetti-fly 0.9s ease-out forwards;
  }
  @keyframes confetti-fly{
    0%   { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.6); }
  }

  .bubble{
    margin-top: 16px;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size: 18px;
    color: var(--wine);
    min-height: 28px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .bubble.show{ opacity: 1; }
  .bubble .cursor{
    display:inline-block;
    width: 2px;
    background: var(--wine);
    margin-left: 2px;
    animation: blink 0.8s step-start infinite;
  }
  @keyframes blink{ 50% { opacity: 0; } }

  .reveal{
    margin-top: 14px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.show{ opacity: 1; transform: translateY(0); }

  .reveal-eyebrow{
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8a7554;
  }
  .secret-word{
    font-family:'Cinzel', serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin: 8px 0 6px;
    border: 1.5px dashed var(--wine);
    padding: 9px 6px;
  }
  .reveal-note{
    font-size: 10.5px;
    color: #6b4a30;
    line-height: 1.6;
    margin-top: 10px;
  }
  .reveal-note b{ color: var(--wine); }

  .cta{
    display:inline-block;
    margin-top: 20px;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size: 13px;
    color: var(--paper);
    background: var(--wine);
    text-decoration:none;
    padding: 12px 22px;
    letter-spacing: 0.04em;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .cta.show{ opacity: 1; }
</style>
</head>
<body>

  <div class="card">
    <div class="stage">
      <div class="shadow"></div>
      <div class="dropper">
        <div class="box" id="box">
          <div class="raviolo">
            <div class="face">
              <div class="cheeks"></div>
              <div class="eyes"><span></span><span></span></div>
              <div class="mouth"></div>
            </div>
          </div>
        </div>
        <div class="burst" id="burst">
          <div class="burst-star"></div>
          <div class="discount" id="discount">10%</div>
        </div>
        <div class="confetti" id="confetti"></div>
      </div>
    </div>

    <div class="bubble" id="bubble"></div>

    <div class="reveal" id="reveal">
      <div class="reveal-eyebrow">La palabra de hoy es</div>
      <div class="secret-word" id="secretWord">—</div>
      <div class="reveal-note">
        Acordate esta palabra y el descuento.<br>
        El día que abramos, decila<br>
        y tenés esa sorpresa. Tu celular tiene una sola tirada 🎲<br>
        <span style="opacity:0.75">Válido una vez por cliente.</span>
      </div>
    </div>

    <span class="cta show" id="cta" style="cursor:default;">???</span>
  </div>

<script>
  // Primera vez: se elige al azar y se guarda en el celular (una sola tirada por dispositivo).
  const combos = [
    ["ALDENTE", "8%"],
    ["SFOGLIA", "9%"],
    ["IMPASTATA", "15%"],
    ["MATTARELLO", "10%"],
    ["TAGLIATA", "12%"],
    ["FARINA00", "15%"],
    ["BUONISSIMA", "9%"],
    ["SUGOSA", "13%"],
    ["PASTAIA", "15%"],
    ["MANOFATTA", "10%"]
  ];
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('pastaio_sorpresa')); } catch(e) {}

  let word, discount;
  if (saved && saved.word && saved.discount) {
    word = saved.word;
    discount = saved.discount;
  } else {
    const randomIndex = Math.floor(Math.random() * combos.length);
    [word, discount] = combos[randomIndex];
    try { localStorage.setItem('pastaio_sorpresa', JSON.stringify({word, discount})); } catch(e) {}
  }
  document.getElementById('secretWord').textContent = word;
  document.getElementById('discount').textContent = discount;

  // Abrir la caja y mostrar el descuento
  const confettiColors = ["#a8823f", "#6b2a2a", "#d8c9a8", "#3a2314"];
  const confettiEl = document.getElementById('confetti');
  for (let c = 0; c < 16; c++) {
    const piece = document.createElement('span');
    const angle = (Math.PI * 2 * c) / 16 + (Math.random() * 0.4 - 0.2);
    const dist = 55 + Math.random() * 45;
    piece.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    piece.style.setProperty('--dy', `${Math.sin(angle) * dist - 20}px`);
    piece.style.setProperty('--rot', `${(Math.random() * 360 - 180)}deg`);
    piece.style.background = confettiColors[c % confettiColors.length];
    piece.style.animationDelay = `${Math.random() * 0.08}s`;
    confettiEl.appendChild(piece);
  }

  setTimeout(() => {
    document.getElementById('box').classList.add('open');
    document.getElementById('burst').classList.add('show');
    confettiEl.classList.add('burst');
  }, 900);

  // Frase random tipo chiste
  const phrases = [
    "¡Un ravioli cayó del cielo!",
    "Uy, se escapó de la olla...",
    "¡Hola! ¿Me esperabas? 🙂"
  ];
  const bubble = document.getElementById('bubble');
  let full = phrases[Math.floor(Math.random() * phrases.length)];
  let i = 0;

  function type() {
    bubble.classList.add('show');
    if (i <= full.length) {
      bubble.innerHTML = full.slice(0, i) + '<span class="cursor">&nbsp;</span>';
      i++;
      setTimeout(type, 45);
    } else {
      bubble.innerHTML = full;
      setTimeout(() => {
        document.getElementById('reveal').classList.add('show');
        document.getElementById('cta').classList.add('show');
      }, 400);
    }
  }
  setTimeout(type, 1500);
</script>

</body>
</html>
